name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    # macOS on purpose: the app only runs on a Mac (CoreML/MLX), and the
    # golden PDF digests depend on the platform's font metrics.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install headless Chromium for the PDF tests
        run: python -m playwright install --with-deps chromium

      # The embedding model the search index's related-words table is built
      # with (pinned by hash in backend/search); the related-words browser
      # tests skip without it.
      - name: Cache the search embedding model
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/JailCallService/search
          key: search-assets-${{ hashFiles('backend/search/assets.py', 'backend/search/embeddings.py') }}

      - name: Fetch the search embedding model
        run: python -m backend.search.assets

      - name: Lint
        run: python -m ruff check backend tests

      - name: Test
        run: python -m pytest tests/

  frontend:
    name: Frontend (tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
